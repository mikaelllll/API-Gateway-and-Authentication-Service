name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions: {contents: read}
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.12"}
      - run: pip install -e '.[dev]'
      - run: ruff check app tests --select F
      - run: pytest --cov=app --cov-report=term-missing
  frontend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: frontend}}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: {node-version: 22}
      - run: npm ci
      - run: npm run lint
      - run: npm run build
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with: {context: ., push: false}
  integration:
    runs-on: ubuntu-latest
    needs: [backend, frontend, container]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Start complete stack
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: Exercise authentication and API-key lifecycle
        run: python tests/integration/smoke.py
      - name: Capture service logs
        if: failure()
        run: docker compose logs --no-color > integration-logs.txt
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: integration-logs
          path: integration-logs.txt
      - name: Stop stack
        if: always()
        run: docker compose down --volumes --remove-orphans
