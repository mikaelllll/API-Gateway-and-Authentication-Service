services:
  app:
    build: .
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql+asyncpg://gateway:gateway@db:5432/gateway
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-codespaces-development-secret-change-in-production}
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 3s
      retries: 10
  db:
    image: postgres:17-alpine
    environment: {POSTGRES_DB: gateway, POSTGRES_USER: gateway, POSTGRES_PASSWORD: gateway}
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck: {test: ["CMD-SHELL","pg_isready -U gateway"], interval: 5s, timeout: 3s, retries: 10}
  redis:
    image: redis:8-alpine
    command: redis-server --save 60 1 --loglevel warning
    volumes: ["redis_data:/data"]
    healthcheck: {test: ["CMD","redis-cli","ping"], interval: 5s, timeout: 3s, retries: 10}
volumes: {postgres_data: {}, redis_data: {}}

