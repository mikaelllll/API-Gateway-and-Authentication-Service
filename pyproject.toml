[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-gateway"
version = "1.0.0"
description = "Production-style API gateway and authentication service portfolio project"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1", "uvicorn[standard]>=0.35,<1", "sqlalchemy[asyncio]>=2.0.40,<3",
  "asyncpg>=0.30,<1", "aiosqlite>=0.21,<1", "redis>=6,<7", "pyjwt[crypto]>=2.10,<3",
  "pwdlib[argon2]>=0.2,<1", "pydantic-settings>=2.10,<3", "email-validator>=2.2,<3",
  "httpx>=0.28,<1", "python-multipart>=0.0.20,<1"
]

[project.optional-dependencies]
dev = ["pytest>=8.4,<9", "pytest-asyncio>=1.1,<2", "pytest-cov>=6.2,<7", "ruff>=0.12,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
